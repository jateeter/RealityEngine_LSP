openapi: 3.1.0
info:
  title: RealityEngine LSP — Reality Engine API
  version: 1.1.0-lsp
  description: 'OpenAPI contract for the Common Lisp (SBCL / Hunchentoot) Reality Engine runtime.


    Default native port: **5601** (PE on 5601 − 1 = 5600).

    Additional LSP instances add +100 per pair (lsp-2: 5701/5700, lsp-3: 5801/5800).

    In Docker/CI deployments the TLS proxy exposes the RE at `https://localhost:5001`.


    Wire-compatible with the CPP (C++) and Scala runtimes.

    Every metric line carries `runtime="lsp"`.

    '
  x-generated-from: /Users/johnt/workspace/GitHub/RealityEngine_CI/SURFACE_SPEC.md
